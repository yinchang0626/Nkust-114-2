<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手機輻射值審驗合格儀表板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
            background: #f0f2f5;
            padding: 24px;
            color: #1a1d28;
        }
        .header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 24px 28px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(99,102,241,0.3);
        }
        .header h1 { font-size: 1.8rem; }
        .header p { opacity: 0.9; margin-top: 4px; font-size: 0.95rem; }

        /* 搜尋區塊 */
        .search-area {
            background: white;
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;
        }
        .search-area .search-icon { font-size: 1.3rem; }
        .search-area input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 0.95rem;
            padding: 6px 0;
        }
        .search-area input::placeholder { color: #b0b7c3; }
        .search-area .clear-btn {
            background: #e5e7eb;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #6b7280;
            transition: 0.2s;
        }
        .search-area .clear-btn:hover { background: #d1d5db; }
        .search-area .result-count {
            font-size: 0.85rem;
            color: #6366f1;
            font-weight: 600;
            white-space: nowrap;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 24px;
        }
        .card {
            background: white;
            border-radius: 14px;
            padding: 20px 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: 0.2s;
            border: 1px solid #e5e7eb;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
        .card .icon {
            width: 48px; height: 48px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; flex-shrink: 0;
        }
        .icon.blue { background: #eef2ff; color: #6366f1; }
        .icon.green { background: #ecfdf5; color: #10b981; }
        .icon.orange { background: #fffbeb; color: #f59e0b; }
        .icon.red { background: #fef2f2; color: #ef4444; }
        .icon.purple { background: #f5f3ff; color: #8b5cf6; }
        .icon.teal { background: #f0fdfa; color: #14b8a6; }
        .card .value { font-size: 1.5rem; font-weight: 700; }
        .card .label { color: #6b7280; font-size: 0.82rem; margin-top: 2px; }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .panel {
            background: white;
            border-radius: 14px;
            padding: 22px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e5e7eb;
        }
        .panel h3 { margin-bottom: 16px; font-size: 1rem; color: #1a1d28; }

        .bars { display: flex; align-items: flex-end; gap: 14px; height: 160px; }
        .bar-group { flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
        .bar { width: 36px; background: linear-gradient(180deg, #6366f1, #a5b4fc); border-radius: 6px 6px 0 0; transition: 0.2s; min-height: 8px; }
        .bar.green { background: linear-gradient(180deg, #10b981, #6ee7b7); }
        .bar:hover { opacity: 0.85; transform: scaleY(1.04); transform-origin: bottom; }
        .bar-label { font-size: 0.72rem; color: #6b7280; margin-top: 6px; }

        .activity { list-style: none; }
        .activity li {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 8px; transition: 0.15s;
            border-bottom: 1px solid #f3f4f6;
        }
        .activity li:hover { background: #f9fafb; }
        .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .dot.purple { background: #6366f1; }
        .dot.green { background: #10b981; }
        .dot.orange { background: #f59e0b; }
        .activity .time { margin-left: auto; font-size: 0.75rem; color: #9ca3af; white-space: nowrap; }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f9fafb; text-align: left; padding: 11px 14px; font-size: 0.78rem; text-transform: uppercase; color: #6b7280; border-bottom: 2px solid #e5e7eb; cursor: pointer; user-select: none; }
        th:hover { background: #f3f4f6; }
        td { padding: 11px 14px; border-bottom: 1px solid #f3f4f6; font-size: 0.88rem; }
        tr:hover td { background: #fafbfc; }
        .pass { color: #059669; font-weight: 600; }
        .low { color: #dc2626; font-weight: 600; }
        .highlight { background: #fef9c3; }

        .no-result {
            text-align: center;
            padding: 30px;
            color: #9ca3af;
            font-size: 0.95rem;
        }

        .pie-chart {
            width: 140px; height: 140px; border-radius: 50%;
            background: conic-gradient(#6366f1 0deg 120deg, #10b981 120deg 200deg, #f59e0b 200deg 270deg, #ef4444 270deg 360deg);
            margin: 10px auto 12px;
        }
        .pie-legend { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; font-size: 0.8rem; }
        .pie-legend span { display: flex; align-items: center; gap: 5px; }
        .pie-legend .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

        @media (max-width: 900px) {
            .cards { grid-template-columns: 1fr 1fr; }
            .row { grid-template-columns: 1fr; }
        }
        @media (max-width: 500px) {
            .cards { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📡 手機輻射值審驗合格統計儀表板</h1>
        <p>電信設備手機輻射值審驗合格型號數量統計</p>
    </div>

    <!-- 🔍 搜尋區 -->
    <div class="search-area">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋品牌、型號、SAR值...（例如：Apple、iPhone、0.98）" oninput="filterTable()">
        <span class="result-count" id="resultCount">共 8 筆</span>
        <button class="clear-btn" onclick="clearSearch()">✕ 清除</button>
    </div>

    <!-- 六張統計卡片 -->
    <div class="cards" id="statsCards"></div>

    <!-- 第一列 -->
    <div class="row">
        <div class="panel">
            <h3>📊 各品牌合格型號數量</h3>
            <div class="bars" id="brandChart"></div>
        </div>
        <div class="panel">
            <h3>🔔 近期審驗通過紀錄</h3>
            <ul class="activity" id="recentList"></ul>
        </div>
    </div>

    <!-- 第二列 -->
    <div class="row">
        <div class="panel">
            <h3>📈 SAR 值區間分佈</h3>
            <div class="pie-chart"></div>
            <div class="pie-legend">
                <span><span class="swatch" style="background:#6366f1;"></span> 0.6-0.8 W/kg (2)</span>
                <span><span class="swatch" style="background:#10b981;"></span> 0.8-1.0 W/kg (4)</span>
                <span><span class="swatch" style="background:#f59e0b;"></span> 1.0-1.2 W/kg (1)</span>
                <span><span class="swatch" style="background:#ef4444;"></span> 1.2+ W/kg (1)</span>
            </div>
        </div>
        <div class="panel">
            <h3>🏭 各品牌設備總數量</h3>
            <div class="bars" id="deviceChart"></div>
        </div>
    </div>

    <!-- 完整表格 -->
    <div class="panel">
        <h3>📋 合格型號明細表</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>品牌</th>
                        <th>型號</th>
                        <th>SAR值 (W/kg)</th>
                        <th>SAR等級</th>
                        <th>狀態</th>
                        <th>數量</th>
                        <th>通過日期</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div class="no-result" id="noResult" style="display:none;">
                😕 找不到符合「<span id="searchTerm"></span>」的資料，請嘗試其他關鍵字
            </div>
        </div>
    </div>

    <script>
        // ---------- 內建資料 ----------
        const data = [
            { brand: 'Apple', model: 'iPhone 16 Pro', sar: 0.98, status: '合格', quantity: 12500, date: '2026-05-20' },
            { brand: 'Samsung', model: 'Galaxy S25 Ultra', sar: 0.89, status: '合格', quantity: 9800, date: '2026-05-18' },
            { brand: 'Xiaomi', model: '14T Pro', sar: 0.76, status: '合格', quantity: 7400, date: '2026-05-15' },
            { brand: 'Apple', model: 'iPhone 16', sar: 0.92, status: '合格', quantity: 11300, date: '2026-05-10' },
            { brand: 'OPPO', model: 'Find X7', sar: 0.68, status: '合格', quantity: 5600, date: '2026-05-08' },
            { brand: 'Samsung', model: 'Galaxy Z Fold6', sar: 0.82, status: '合格', quantity: 4200, date: '2026-05-05' },
            { brand: 'Google', model: 'Pixel 9 Pro', sar: 1.02, status: '合格', quantity: 3800, date: '2026-05-02' },
            { brand: 'ASUS', model: 'Zenfone 11 Ultra', sar: 0.95, status: '合格', quantity: 2900, date: '2026-04-28' }
        ];

        // ---------- 統計 ----------
        const totalModels = data.length;
        const totalDevices = data.reduce((s, d) => s + d.quantity, 0);
        const avgSAR = (data.reduce((s, d) => s + d.sar, 0) / totalModels).toFixed(2);
        const passRate = ((data.filter(d => d.status === '合格').length / totalModels) * 100).toFixed(1);
        const maxSAR = Math.max(...data.map(d => d.sar));
        const minSAR = Math.min(...data.map(d => d.sar));
        const latestDate = data.reduce((latest, d) => d.date > latest ? d.date : latest, data[0].date);

        document.getElementById('statsCards').innerHTML = `
            <div class="card"><div class="icon blue">📱</div><div><div class="value">${totalModels}</div><div class="label">合格型號總數</div></div></div>
            <div class="card"><div class="icon green">✔️</div><div><div class="value">${totalDevices.toLocaleString()}</div><div class="label">合格設備總數量</div></div></div>
            <div class="card"><div class="icon orange">📡</div><div><div class="value">${avgSAR} W/kg</div><div class="label">平均SAR值</div></div></div>
            <div class="card"><div class="icon purple">📋</div><div><div class="value">${passRate}%</div><div class="label">審驗通過率</div></div></div>
            <div class="card"><div class="icon red">⚠️</div><div><div class="value">${maxSAR} W/kg</div><div class="label">最高SAR值</div></div></div>
            <div class="card"><div class="icon teal">📅</div><div><div class="value">${latestDate}</div><div class="label">最新通過日期</div></div></div>
        `;

        // ---------- 品牌型號數量圖 ----------
        const brandCount = {};
        data.forEach(d => brandCount[d.brand] = (brandCount[d.brand] || 0) + 1);
        const maxBrand = Math.max(...Object.values(brandCount));
        const chartDiv = document.getElementById('brandChart');
        for (const [brand, count] of Object.entries(brandCount)) {
            const h = (count / maxBrand) * 100;
            const g = document.createElement('div'); g.className = 'bar-group';
            g.innerHTML = `<div class="bar" style="height:${h}%;" title="${brand}: ${count} 型號"></div><div class="bar-label">${brand}</div>`;
            chartDiv.appendChild(g);
        }

        // ---------- 品牌設備總數量圖 ----------
        const brandQty = {};
        data.forEach(d => brandQty[d.brand] = (brandQty[d.brand] || 0) + d.quantity);
        const maxQty = Math.max(...Object.values(brandQty));
        const deviceChart = document.getElementById('deviceChart');
        for (const [brand, qty] of Object.entries(brandQty)) {
            const h = (qty / maxQty) * 100;
            const g = document.createElement('div'); g.className = 'bar-group';
            g.innerHTML = `<div class="bar green" style="height:${h}%;" title="${brand}: ${qty.toLocaleString()} 台"></div><div class="bar-label">${brand}</div>`;
            deviceChart.appendChild(g);
        }

        // ---------- 近期紀錄 ----------
        const sorted = [...data].sort((a, b) => new Date(b.date) - new Date(a.date));
        const recentDiv = document.getElementById('recentList');
        const dots = ['purple', 'green', 'orange'];
        sorted.slice(0, 5).forEach((d, i) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span class="dot ${dots[i % 3]}"></span>
                <span><strong>${d.brand} ${d.model}</strong> · SAR ${d.sar} W/kg</span>
                <span class="time">${d.date}</span>
            `;
            recentDiv.appendChild(li);
        });

        // ---------- 🔍 搜尋功能 ----------
        function renderTable(filteredData) {
            const tableBody = document.getElementById('tableBody');
            const noResult = document.getElementById('noResult');
            const searchTerm = document.getElementById('searchTerm');
            const resultCount = document.getElementById('resultCount');
            const keyword = document.getElementById('searchInput').value.trim();

            tableBody.innerHTML = '';

            if (filteredData.length === 0) {
                noResult.style.display = 'block';
                searchTerm.textContent = keyword;
                resultCount.textContent = '0 筆';
            } else {
                noResult.style.display = 'none';
                resultCount.textContent = `共 ${filteredData.length} 筆`;
            }

            filteredData.forEach(d => {
                let level = '';
                if (d.sar < 0.8) level = '低';
                else if (d.sar < 1.0) level = '中';
                else level = '高';
                const levelClass = level === '低' ? 'pass' : (level === '高' ? 'low' : '');

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${d.brand}</td>
                    <td><strong>${d.model}</strong></td>
                    <td>${d.sar} W/kg</td>
                    <td class="${levelClass}">${level}</td>
                    <td class="pass">${d.status}</td>
                    <td>${d.quantity.toLocaleString()}</td>
                    <td>${d.date}</td>
                `;

                // 🔍 高亮搜尋關鍵字
                if (keyword) {
                    tr.innerHTML = tr.innerHTML.replace(
                        new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'),
                        '<span class="highlight">$1</span>'
                    );
                }

                tableBody.appendChild(tr);
            });
        }

        function filterTable() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            if (keyword === '') {
                renderTable(data);
                return;
            }
            const filtered = data.filter(d =>
                d.brand.toLowerCase().includes(keyword) ||
                d.model.toLowerCase().includes(keyword) ||
                d.sar.toString().includes(keyword) ||
                d.status.includes(keyword) ||
                d.date.includes(keyword)
            );
            renderTable(filtered);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            renderTable(data);
        }

        // 初始渲染
        renderTable(data);
    </script>
</body>
</html>
